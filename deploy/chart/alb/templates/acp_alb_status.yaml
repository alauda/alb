{{ if .Capabilities.APIVersions.Has "ait.alauda.io/v1alpha2" -}}
kind: MonitorDashboard
apiVersion: ait.alauda.io/v1alpha2
metadata:
  labels:
    cpaas.io/dashboard.folder: container-platform
    cpaas.io/dashboard.tag.built-in: "true"
  name: albstatus
  namespace: "cpaas-system"
spec:
  body:
    __elements: {}
    __inputs:
      - description: ""
        label: prometheus
        name: DS_PROMETHEUS
        pluginId: prometheus
        pluginName: Prometheus
        type: datasource
    __requires:
      - id: grafana
        name: Grafana
        type: grafana
        version: 9.5.21
      - id: prometheus
        name: Prometheus
        type: datasource
        version: 1.0.0
      - id: stat
        name: Stat
        type: panel
        version: ""
      - id: table
        name: Table
        type: panel
        version: ""
      - id: timeseries
        name: Time series
        type: panel
        version: ""
    annotations:
      list:
        - builtIn: 1
          datasource:
            type: grafana
            uid: -- Grafana --
          enable: true
          hide: true
          iconColor: rgba(0, 211, 255, 1)
          name: Annotations & Alerts
          type: dashboard
        - datasource:
            type: grafana
            uid: -- Grafana --
          enable: true
          iconColor: rgba(0, 211, 255, 1)
          iconSize: 0
          lineColor: ""
          name: Annotations & Alerts
          query: ""
          showLine: false
          tagsField: ""
          textField: ""
          type: dashboard
    description: alb-exporter
    editable: false
    fiscalYearStartMonth: 0
    graphTooltip: 0
    links: []
    liveNow: false
    panels:
      - fieldConfig:
          defaults:
            custom:
              align: left
              drawStyle: line
              thresholdsStyle:
                mode: off
            mappings: []
            thresholds:
              mode: absolute
              steps:
                - color: "#007AF5"
            unit: decbytes
          overrides: []
        gridPos:
          h: 8
          id: f132fc4c-0b12-423c-b148-5341f03155d5
          w: 6
          x: 0
          "y": 0
        id: f132fc4c-0b12-423c-b148-5341f03155d5
        links: []
        options:
          displayLabels: []
          legend:
            calcs:
              - latest
            placement: bottom
            placementRightTop: ""
            showLegend: true
          orientation: auto
          pieType: pie
          reduceOptions:
            calcs:
              - latest
          setting:
            unit: decbytes
            unitType: up_data
          tooltip:
            mode: multi
            sort: desc
        targets:
          - expr: shared_dict_free{vmcluster="$vmcluster",namespace=~"$namespace",
              pod=~"$name-.*"}
            instant: false
            legendFormat: '{{ printf "{{.name}}-{{.pod}}" }}'
            range: true
            refId: shared-dict-free
        title: Shared Dict Free
        type: timeseries
        transformations: []
      - fieldConfig:
          defaults:
            custom:
              align: left
              drawStyle: line
              thresholdsStyle:
                mode: off
            mappings: []
            thresholds:
              mode: absolute
              steps:
                - color: "#007AF5"
            unit: ms
          overrides: []
        gridPos:
          h: 8
          id: fc3fc26a-5944-47d6-a085-6bfe18126cdd
          w: 6
          x: 6
          "y": 0
        id: fc3fc26a-5944-47d6-a085-6bfe18126cdd
        links: []
        options:
          displayLabels: []
          legend:
            calcs:
              - latest
            placement: bottom
            placementRightTop: ""
            showLegend: true
          orientation: auto
          pieType: pie
          reduceOptions:
            calcs:
              - latest
          setting:
            unit: ms
            unitType: time
          tooltip:
            mode: multi
            sort: desc
        targets:
          - expr: alb_loop_time{vmcluster="$vmcluster",namespace=~"$namespace",
              pod=~"$name-.*"}
            instant: false
            legendFormat: '{{ printf "{{.pod}}" }}'
            range: true
            refId: alb-loop-time
        title: Alb Loop Time
        type: timeseries
        transformations: []
      - datasource:
          type: prometheus
          uid: ${DS_PROMETHEUS}
        description: 当前 ALB 上最近 5 分钟每秒 4XX 和 5XX 请求的比例
        fieldConfig:
          defaults:
            color:
              mode: thresholds
            custom:
              spanNulls: false
            mappings: []
            thresholds:
              mode: absolute
              steps:
                - color: "#E02F44"
                  value: 80
                - color: "#56A64B"
            unit: percentunit
          overrides: []
        gridPos:
          "h": 8
          "id": 14
          "w": 6
          "x": 12
          "y": 0
        id: 14
        options:
          colorMode: value
          graphMode: area
          justifyMode: auto
          legend:
            calcs: []
          orientation: horizontal
          reduceOptions:
            calcs:
              - latest
            fields: ""
            values: false
          textMode: auto
          tooltip: {}
        pluginVersion: 9.5.21
        targets:
          - datasource:
              type: prometheus
              uid: ${DS_PROMETHEUS}
            editorMode: code
            expr: sum(rate(nginx_http_status{vmcluster="$vmcluster",
              namespace=~"$namespace", pod=~"$name-.*",
              status=~"[4-5].*"}[5m]))/(sum(irate(nginx_http_status{vmcluster="$vmcluster",
              namespace=~"$namespace", pod=~"$name-.*"}[5m])) + 0.01)
            legendFormat: ""
            range: true
            refId: A
        title: Error Rate
        type: stat
        transformations: []
      - datasource:
          type: prometheus
          uid: ${DS_PROMETHEUS}
        description: 当前 ALB 上最近 5 分钟请求的平均延迟
        fieldConfig:
          defaults:
            custom:
              align: left
              drawStyle: line
              spanNulls: false
              thresholdsStyle:
                mode: line
            mappings: []
            thresholds:
              mode: absolute
              steps:
                - color: "#E02F44"
                  value: "80"
                - color: "#56A64B"
            unit: s
          overrides: []
        gridPos:
          "h": 8
          "id": 16
          "w": 6
          "x": 18
          "y": 0
        id: 16
        links: []
        options:
          colorMode: value
          displayLabels: []
          graphMode: area
          justifyMode: auto
          legend:
            calcs: []
            placementRightTop: ""
            showLegend: true
          orientation: horizontal
          pieType: pie
          reduceOptions:
            calcs:
              - latest
            fields: ""
            values: false
          setting:
            unit: s
            unitType: time
          textMode: auto
          tooltip:
            mode: multi
            sort: desc
        pluginVersion: 9.5.21
        targets:
          - expr: sum(increase(nginx_http_request_duration_seconds_sum{vmcluster="$vmcluster",
              namespace=~"$namespace",
              pod=~"$name-.*"}[5m]))/sum(increase(nginx_http_request_duration_seconds_count{vmcluster="$vmcluster",
              namespace=~"$namespace", pod=~"$name-.*"}[5m]))
            instant: false
            range: true
            refId: A
        title: Latency
        type: timeseries
        transformations: []
      - datasource:
          type: prometheus
          uid: ${DS_PROMETHEUS}
        description: 当前 ALB 上的活跃连接数
        fieldConfig:
          defaults:
            custom:
              align: left
              drawStyle: line
              spanNulls: false
              thresholdsStyle:
                mode: line
            mappings: []
            thresholds:
              mode: absolute
              steps:
                - color: "#E02F44"
                  value: "80"
                - color: "#56A64B"
            unit: ""
          overrides: []
        gridPos:
         "h": 8
         "id": 10
         "w": 6
         "x": 0
         "y": 8
        id: 10
        links: []
        options:
          colorMode: value
          displayLabels: []
          graphMode: area
          justifyMode: auto
          legend:
            calcs: []
            placementRightTop: ""
            showLegend: true
          orientation: horizontal
          pieType: pie
          reduceOptions:
            calcs:
              - latest
            fields: ""
            values: false
          setting:
            unit: ""
            unitType: customize
          textMode: auto
          tooltip:
            mode: multi
            sort: desc
        pluginVersion: 9.5.21
        targets:
          - expr: sum(nginx_http_connections{vmcluster="$vmcluster",
              namespace=~"$namespace", pod=~"$name-.*", state="active"})
            instant: false
            range: true
            refId: A
        title: Active Connections
        type: timeseries
        transformations: []
      - datasource:
          type: prometheus
          uid: ${DS_PROMETHEUS}
        description: 当前 ALB 上最近 5 分钟的每秒请求量
        fieldConfig:
          defaults:
            custom:
              align: left
              drawStyle: line
              spanNulls: false
              thresholdsStyle:
                mode: line
            mappings: []
            thresholds:
              mode: absolute
              steps:
                - color: "#E02F44"
                  value: "80"
                - color: "#56A64B"
            unit: reqps
          overrides: []
        gridPos:
         "h": 8
         "id": 12
         "w": 6
         "x": 6
         "y": 8
        id: 12
        links: []
        options:
          colorMode: value
          displayLabels: []
          graphMode: area
          justifyMode: auto
          legend:
            calcs: []
            placementRightTop: ""
            showLegend: true
          orientation: horizontal
          pieType: pie
          reduceOptions:
            calcs:
              - latest
            fields: ""
            values: false
          setting:
            unit: reqps
            unitType: customize
          textMode: auto
          tooltip:
            mode: multi
            sort: desc
        pluginVersion: 9.5.21
        targets:
          - expr: sum(rate(nginx_http_status{vmcluster="$vmcluster",
              namespace=~"$namespace", pod=~"$name-.*"}[5m]))
            instant: false
            range: true
            refId: A
        title: Requests Per Second
        type: timeseries
        transformations: []
      - datasource:
          type: prometheus
          uid: ${DS_PROMETHEUS}
        description: 当前 ALB 的网络 IO 吞吐
        fieldConfig:
          defaults:
            color:
              mode: palette-classic
            custom:
              axisCenteredZero: false
              axisColorMode: text
              axisLabel: ""
              axisPlacement: auto
              barAlignment: 0
              drawStyle: line
              fillOpacity: 0
              gradientMode: none
              hideFrom:
                legend: false
                tooltip: false
                viz: false
              lineInterpolation: linear
              lineWidth: 1
              pointSize: 5
              scaleDistribution:
                type: linear
              showPoints: auto
              spanNulls: false
              stacking:
                group: A
                mode: none
              thresholdsStyle:
                mode: off
            mappings: []
            thresholds:
              mode: absolute
              steps:
                - color: "#E02F44"
                  value: 80
                - color: "#56A64B"
            unit: binBps
          overrides: []
        gridPos:
          "h": 8
          "id": 6
          "w": 6
          "x": 12
          "y": 8
        id: 6
        options:
          legend:
            calcs: []
            displayMode: list
            placement: bottom
            showLegend: true
          reduceOptions: {}
          tooltip:
            mode: single
            sort: desc
        targets:
          - datasource:
              type: prometheus
              uid: ${DS_PROMETHEUS}
            editorMode: code
            exemplar: false
            expr: sum by(pod_name)
              (container_network_receive_bytes_total_irate5m{pod_name=~"$name-.*",
              namespace=~"$namespace", vmcluster="$vmcluster"})
            legendFormat: '{{ printf "{{.pod_name}}/receive" }}'
            range: true
            refId: A
          - datasource:
              type: prometheus
              uid: ${DS_PROMETHEUS}
            editorMode: code
            expr: sum by(pod_name)
              (container_network_transmit_bytes_total_irate5m{pod_name=~"$name-.*",
              namespace=~"$namespace", vmcluster="$vmcluster"})
            hide: false
            interval: ""
            legendFormat: '{{ printf "{{.pod_name}}/transmit" }}'
            range: true
            refId: B
        title: Network Receive/Transmit
        type: timeseries
        transformations: []
      - datasource:
          type: prometheus
          uid: ${DS_PROMETHEUS}
        description: 当前 ALB 的磁盘 IO 吞吐
        fieldConfig:
          defaults:
            custom:
              align: left
              axisCenteredZero: false
              axisColorMode: text
              axisLabel: ""
              axisPlacement: auto
              barAlignment: 0
              drawStyle: line
              gradientMode: none
              hideFrom:
                legend: false
                tooltip: false
                viz: false
              lineInterpolation: linear
              lineWidth: 1
              pointSize: 5
              scaleDistribution:
                type: linear
              showPoints: auto
              spanNulls: false
              stacking:
                group: A
                mode: none
              thresholdsStyle:
                mode: off
            mappings: []
            thresholds:
              mode: absolute
              steps:
                - color: "#E02F44"
                  value: "80"
                - color: "#56A64B"
            unit: binBps
          overrides: []
        gridPos:
         "h": 8
         "id": 8
         "w": 6
         "x": 18
         "y": 8
        id: 8
        links: []
        options:
          displayLabels: []
          legend:
            calcs: []
            displayMode: list
            placement: bottom
            placementRightTop: ""
            showLegend: true
          orientation: auto
          pieType: pie
          reduceOptions:
            calcs:
              - latest
          setting:
            unit: binBps
            unitType: customize
          tooltip:
            mode: multi
            sort: desc
        targets:
          - expr: sum by(pod)
              (rate(container_fs_writes_bytes_total{vmcluster="$vmcluster",namespace=~"$namespace",pod=~"$name-.*",container!=""}[5m]))
            instant: false
            legendFormat: '{{ printf "{{.pod}}/write" }}'
            range: true
            refId: A
          - expr: sum by(pod)
              (rate(container_fs_reads_bytes_total{vmcluster="$vmcluster",namespace=~"$namespace",pod=~"$name-.*",container!=""}[5m]))
            legendFormat: '{{ printf "{{.pod}}/reads" }}'
            range: true
            refId: B
        title: Disk Read/Write Rate
        type: timeseries
        transformations: []
      - datasource:
          type: prometheus
          uid: ${DS_PROMETHEUS}
        description: 当前 ALB 的 CPU 使用量
        fieldConfig:
          defaults:
            color:
              mode: palette-classic
            custom:
              axisCenteredZero: false
              axisColorMode: text
              axisLabel: ""
              axisPlacement: auto
              barAlignment: 0
              drawStyle: line
              fillOpacity: 0
              gradientMode: none
              hideFrom:
                legend: false
                tooltip: false
                viz: false
              lineInterpolation: linear
              lineWidth: 1
              pointSize: 5
              scaleDistribution:
                type: linear
              showPoints: auto
              spanNulls: false
              stacking:
                group: A
                mode: none
              thresholdsStyle:
                mode: off
            mappings: []
            thresholds:
              mode: absolute
              steps:
                - color: "#E02F44"
                  value: 80
                - color: "#56A64B"
            unit: core
          overrides: []
        gridPos:
         "h": 8
         "id": 2
         "w": 6
         "x": 0
         "y": 16
        id: 2
        options:
          legend:
            calcs: []
            displayMode: list
            placement: bottom
            showLegend: true
          reduceOptions: {}
          tooltip:
            mode: single
            sort: desc
        targets:
          - datasource:
              type: prometheus
              uid: ${DS_PROMETHEUS}
            editorMode: builder
            expr: sum by(pod_name)
              (container_cpu_usage_seconds_total_irate5m{pod_name=~"$name-.*",
              namespace=~"$namespace", vmcluster="$vmcluster"})
            legendFormat: ""
            range: true
            refId: A
        title: CPU Usage
        type: timeseries
        transformations: []
      - datasource:
          type: prometheus
          uid: ${DS_PROMETHEUS}
        description: 当前 ALB 的内存使用量
        fieldConfig:
          defaults:
            color:
              mode: palette-classic
            custom:
              axisCenteredZero: false
              axisColorMode: text
              axisLabel: ""
              axisPlacement: auto
              barAlignment: 0
              drawStyle: line
              fillOpacity: 0
              gradientMode: none
              hideFrom:
                legend: false
                tooltip: false
                viz: false
              lineInterpolation: linear
              lineWidth: 1
              pointSize: 5
              scaleDistribution:
                type: linear
              showPoints: auto
              spanNulls: false
              stacking:
                group: A
                mode: none
              thresholdsStyle:
                mode: off
            decimals: 0
            mappings: []
            thresholds:
              mode: absolute
              steps:
                - color: "#E02F44"
                  value: 80
                - color: "#56A64B"
            unit: bytes
          overrides: []
        gridPos:
         "h": 8
         "id": 4
         "w": 6
         "x": 6
         "y": 16
        id: 4
        options:
          legend:
            calcs: []
            displayMode: list
            placement: bottom
            showLegend: true
          reduceOptions: {}
          tooltip:
            mode: single
            sort: desc
        targets:
          - datasource:
              type: prometheus
              uid: ${DS_PROMETHEUS}
            editorMode: code
            expr: sum by(pod_name)
              (container_memory_working_set_bytes{pod_name=~"$name-.*",namespace=~"$namespace",
              vmcluster="$vmcluster"})
            legendFormat: ""
            range: true
            refId: A
        title: Memory Usage
        type: timeseries
        transformations: []
      - datasource:
          type: prometheus
          uid: ${DS_PROMETHEUS}
        description: 当前 ALB 上 Ingress 最近 5 分钟的 QPS，请求吞吐量，响应吞吐量，错误率，P50 延迟，上游 P50 延迟，P90
          延迟，上游 P90 延迟，P99 延迟，上游 P99 延迟
        fieldConfig:
          defaults:
            color:
              mode: thresholds
            custom:
              align: auto
              cellOptions:
                type: auto
              filterable: false
              inspect: false
            mappings: []
            thresholds:
              mode: absolute
              steps:
                - color: "#E02F44"
                  value: 80
                - color: "#56A64B"
            unit: s
          overrides:
            - matcher:
                id: byName
                options: QPS
              properties:
                - id: unit
                  value: reqps
            - matcher:
                id: byName
                options: Error Rate
              properties:
                - id: unit
                  value: percentunit
                - id: noValue
                  value: 0%
            - matcher:
                id: byName
                options: Request BPS
              properties:
                - id: unit
                  value: bytes
            - matcher:
                id: byName
                options: Response BPS
              properties:
                - id: unit
                  value: bytes
        gridPos:
         "h": 13
         "id": 18
         "w": 24
         "x": 0
         "y": 24
        id: 18
        options:
          cellHeight: sm
          footer:
            countRows: false
            enablePagination: true
            fields: []
            reducer:
              - sum
            show: false
          frameIndex: 2
          legend:
            calcs: []
          reduceOptions: {}
          showHeader: true
          sortBy:
            - desc: true
              displayName: Response BPS
          tooltip: {}
        pluginVersion: 9.5.21
        targets:
          - datasource:
              type: prometheus
              uid: ${DS_PROMETHEUS}
            editorMode: code
            exemplar: false
            expr: sum by(source_namespace, source_name)
              (rate(nginx_http_status{vmcluster="$vmcluster",
              namespace=~"$namespace", pod=~"$name-.*",
              source_type="ingress"}[5m]))
            format: table
            instant: true
            legendFormat: /
            range: false
            refId: QPS
          - datasource:
              type: prometheus
              uid: ${DS_PROMETHEUS}
            editorMode: code
            exemplar: false
            expr: histogram_quantile(0.50,
              sum(rate(nginx_http_request_duration_seconds_bucket{vmcluster="$vmcluster",
              namespace=~"$namespace", pod=~"$name-.*",
              source_type="ingress"}[5m])) by (le, source_namespace,
              source_name))
            format: table
            hide: false
            instant: true
            legendFormat: /
            range: false
            refId: P50
          - datasource:
              type: prometheus
              uid: ${DS_PROMETHEUS}
            editorMode: code
            exemplar: false
            expr: histogram_quantile(0.90,
              sum(rate(nginx_http_request_duration_seconds_bucket{vmcluster="$vmcluster",
              namespace=~"$namespace", pod=~"$name-.*",
              source_type="ingress"}[5m])) by (le, source_namespace,
              source_name))
            format: table
            hide: false
            instant: true
            legendFormat: /
            range: false
            refId: P90
          - datasource:
              type: prometheus
              uid: ${DS_PROMETHEUS}
            editorMode: code
            exemplar: false
            expr: histogram_quantile(0.99,
              sum(rate(nginx_http_request_duration_seconds_bucket{vmcluster="$vmcluster",
              namespace=~"$namespace", pod=~"$name-.*",
              source_type="ingress"}[5m])) by (le, source_namespace,
              source_name))
            format: table
            hide: false
            instant: true
            legendFormat: /
            range: false
            refId: P99
          - datasource:
              type: prometheus
              uid: ${DS_PROMETHEUS}
            editorMode: code
            exemplar: false
            expr: (sum(rate(nginx_http_status{vmcluster="$vmcluster", status=~"[4-5].*",
              source_type="ingress", namespace=~"$namespace",
              pod=~"$name-.*"}[5m])) by (source_namespace, source_name) + 0 )/
              (sum(rate(nginx_http_status{vmcluster="$vmcluster",
              source_type="ingress", namespace=~"$namespace",
              pod=~"$name-.*"}[5m])) by (source_namespace, source_name) + 0.01)
            format: table
            hide: false
            instant: true
            legendFormat: /
            range: false
            refId: Error Rate
          - datasource:
              type: prometheus
              uid: ${DS_PROMETHEUS}
            editorMode: code
            exemplar: false
            expr: histogram_quantile(0.50,
              sum(rate(nginx_http_upstream_request_duration_seconds_bucket{vmcluster="$vmcluster",
              namespace=~"$namespace", pod=~"$name-.*",
              source_type="ingress"}[5m])) by (le, source_namespace,
              source_name))
            format: table
            hide: false
            instant: true
            legendFormat: /
            range: false
            refId: UpstreamP50
          - datasource:
              type: prometheus
              uid: ${DS_PROMETHEUS}
            editorMode: code
            exemplar: false
            expr: histogram_quantile(0.90,
              sum(rate(nginx_http_upstream_request_duration_seconds_bucket{vmcluster="$vmcluster",
              namespace=~"$namespace", pod=~"$name-.*",
              source_type="ingress"}[5m])) by (le, source_namespace,
              source_name))
            format: table
            hide: false
            instant: true
            legendFormat: /
            range: false
            refId: Upstream P90
          - datasource:
              type: prometheus
              uid: ${DS_PROMETHEUS}
            editorMode: code
            exemplar: false
            expr: histogram_quantile(0.99,
              sum(rate(nginx_http_upstream_request_duration_seconds_bucket{vmcluster="$vmcluster",
              namespace=~"$namespace", pod=~"$name-.*",
              source_type="ingress"}[5m])) by (le, source_namespace,
              source_name))
            format: table
            hide: false
            instant: true
            legendFormat: /
            range: false
            refId: Upstream P99
          - datasource:
              type: prometheus
              uid: ${DS_PROMETHEUS}
            editorMode: code
            exemplar: false
            expr: sum(rate(nginx_http_request_size_bytes{vmcluster="$vmcluster",
              namespace=~"$namespace", pod=~"$name-.*",
              source_type="ingress"}[5m])) by (source_namespace,source_name)
            format: table
            hide: false
            instant: true
            legendFormat: /
            range: false
            refId: Request BPS
          - datasource:
              type: prometheus
              uid: ${DS_PROMETHEUS}
            editorMode: code
            exemplar: false
            expr: sum(rate(nginx_http_response_size_bytes{vmcluster="$vmcluster",
              namespace=~"$namespace", pod=~"$name-.*",
