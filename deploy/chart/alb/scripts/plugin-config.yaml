supportedUpgradeVersions: ">= v1.0.0"
mustUpgrade: false
valuesTemplates:
  acp/chart-alauda-alb2: |
    <<- $replicas := .Alb2Nodes | len >>
    <<- $address := .VIP >>
    <<- $ingressHTTPPort := 0 >>
    <<- $ingressHTTPSPort := .Alb2Port >>
    <<- $metricsPort := 11782 >>
    <<- $loadbalancerName := .SystemNamespace >>
    <<- $defaultSSLCert := (printf "%s/%s" .SystemNamespace .SystemNamespace) >>
    <<- $defaultSSLStrategy := "Always" >>
    <<- $nodeSelector := (printf "cpaas-system-alb: %s" (quote "")) >>
    <<- $projects := .SystemNamespace >>

    <<- $addressType := index .Cluster.ObjectMeta.Annotations "cpaas.io/alb-address-type" >>
    <<- $albNetworkMode := index .Cluster.ObjectMeta.Annotations "cpaas.io/alb-networkmode" >>
    <<- $albNeedVip := index .Cluster.ObjectMeta.Annotations "cpaas.io/alb-need-vip" >>

    <<- $needVip := (or (eq .ProvisionType "Registered") (and (ne .ClusterType "DCS") (ne .ClusterType "Baremetal") (ne .ClusterType "OCP") (ne .ClusterType "Imported"))) >>
    <<- $networkMode := "container" >>

    <<- if or (eq $addressType "ClusterAddress") (eq $albNetworkMode "host") >>
      <<- $needVip = false >>
    <<- end >>

    <<- if eq $albNetworkMode "container" >>
      <<- $needVip = true >>
      <<- $networkMode = "container" >>
    <<- end >>

    <<- if $albNeedVip >>
      <<- if (eq $albNeedVip "true") >>
        <<- $needVip = true >>
      <<- else if (eq $albNeedVip "false") >>
        <<- $needVip = false >>
      <<- end >>
    <<- end >>


    <<- $enableLbSvc := (ne .ProvisionType "Registered") >>
    <<- $needLbSvcAnnotations := (and (ne .ProvisionType "Registered") (eq .ClusterType "HuaweiCloudCCE")) >>
    <<- $needHuaweiLbSvcAnnotations := (and (ne .ProvisionType "Registered") (eq .ClusterType "HuaweiCloudCCE")) >>

    <<- if eq .ClusterName "global" >>
      <<- if (and (eq .ClusterType "Baremetal") (eq .Base.DeployType "ImportedGlobal")) >>
        <<- $nodeSelector = (printf "node-role.kubernetes.io/control-plane: %s" (quote "")) >>
        <<- $ingressHTTPPort = 0 >>
        <<- $ingressHTTPSPort = 0 >>
        <<- $defaultSSLStrategy = "Always" >>
      <<- else >>
        <<- labelClusterNode "global" "ingress" "true" .Base.Ingress.Controller.Nodes >>
        <<- $nodeSelector = (printf "ingress: %s" (quote "true")) >>
        <<- $ingressHTTPPort = .Base.HTTP.HTTPPort >>
        <<- $ingressHTTPSPort = .Base.HTTP.HTTPSPort >>
        <<- if .Base.HTTP.ForceRedirectHTTPS >>
          <<- $defaultSSLStrategy = "Always" >>
        <<- else >>
          <<- $defaultSSLStrategy = "Both" >>
        <<- end >>
      <<- end >>
      <<- $replicas = (len .Base.Ingress.Controller.Nodes) >>
      <<- $loadbalancerName = "global-alb2" >>
      <<- $defaultSSLCert = (printf "%s/dex.tls" .SystemNamespace) >>
      <<- $projects = "cpaas-system" >>
    <<- else >>
      <<- $ns := (lookup .ClusterName "v1" "Namespace" "" .SystemNamespace) >>
      <<- if $ns >>
        <<- $key := (printf "%s/project" .LabelBaseDomain) >>
        <<- $label := (index $ns "metadata" "labels" $key) >>
        <<- if ne (string $label) .SystemNamespace >>
          <<- label .ClusterName $ns $key .SystemNamespace >>
        <<- end >>
      <<- end >>
    <<- end >>

    replicas: << $replicas >>
    <<- if (index .Cluster.ObjectMeta.Annotations "cpaas.io/alb-bind-nic") >>
    bindNIC: << (printf "'%s'" (index .Cluster.ObjectMeta.Annotations "cpaas.io/alb-bind-nic")) >>
    <<- end >>
    <<- if (index .Cluster.ObjectMeta.Annotations "cpaas.io/alb-enable-ipv6") >>
    enableIPV6: << (printf "%s" (index .Cluster.ObjectMeta.Annotations "cpaas.io/alb-enable-ipv6")) >>
    <<- end >>
    address: << $address >>
    defaultSSLCert: << $defaultSSLCert >>
    defaultSSLStrategy: << $defaultSSLStrategy >>
    ingressHTTPPort: << $ingressHTTPPort >>
    ingressHTTPSPort: << $ingressHTTPSPort >>
    metricsPort: << $metricsPort >>
    antiAffinityKey: system
    gateway:
      enable: false
    loadbalancerName: << $loadbalancerName >>
    projects:
      - << $projects >>
    <<- if (and (ne .ProvisionType "Registered") (or (eq .ClusterType "DCS") (eq .ClusterType "Baremetal") (eq .ClusterType "OCP") (eq .ClusterType "Imported") ) ) >>
    nodeSelector:
      << $nodeSelector >>
    <<- end >>
    <<- if $needVip >>
    vip:
      allocateLoadBalancerNodePorts: true
      enableLbSvc: << $enableLbSvc >>
      <<- if $needLbSvcAnnotations >>
      lbSvcAnnotations:
        <<- if $needHuaweiLbSvcAnnotations >>
        kubernetes.io/elb.class: union
        kubernetes.io/elb.autocreate: '{
          "type": "public",
          "bandwidth_name": "cce-bandwidth-<< .ClusterName >>-<< .SystemNamespace >>",
          "bandwidth_chargemode": "traffic",
          "bandwidth_size": 5,
          "bandwidth_sharetype": "PER",
          "eip_type": "5_bgp"
        }'
        kubernetes.io/elb.lb-algorithm: ROUND_ROBIN
        kubernetes.io/elb.health-check-flag: 'on'
        kubernetes.io/elb.health-check-option: '{"protocol":"TCP","delay":"5","timeout":"10","max_retries":"3"}'
        <<- end >>
      lbSvcIpFamilyPolicy: SingleStack
      <<- end >>
    networkMode: << $networkMode >>
    <<- end >>
